version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: content-ai-api
    environment:
      DATABASE_URL: sqlite:////data/content_ai.db
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
      - db_data:/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: content-ai-worker
    environment:
      DATABASE_URL: sqlite:////data/content_ai.db
      WORKER_POLL_INTERVAL_S: "1.0"
      PYTHONPATH: /app/src
    volumes:
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
      - db_data:/data
    depends_on:
      - api

  web:
    image: node:20-alpine
    container_name: content-ai-web
    working_dir: /app/web
    command: sh -lc "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      - api

volumes:
  uploads_data:
  outputs_data:
  db_data:
